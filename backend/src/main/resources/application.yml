spring:
  application:
    name: soccer-development-api

  datasource:
    url: jdbc:postgresql://localhost:5432/soccer_dev
    username: miguelgalindo
    password:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-missing-migrations: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  # 64-byte base64 secret — replace with a secure random value in production
  secret: c29jY2VyLWRldmVsb3BtZW50LXBsYXRmb3JtLWp3dC1zZWNyZXQta2V5LTIwMjQtcHJvZC1jaGFuZ2UtbWU=
  expiration: 86400000  # 24 hours in milliseconds

logging:
  level:
    com.soccerdev: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
