spring:
  application:
    name: soccer-development-api

  datasource:
    url: jdbc:postgresql://localhost:5432/soccer_dev
    username: miguelgalindo
    password:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.soccerdev: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
